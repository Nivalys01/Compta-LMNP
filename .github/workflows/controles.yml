# Contrôles automatiques — tests et lint à chaque poussée sur main.
#
# Ce qui N'EST PAS lancé ici, et pourquoi
# ---------------------------------------
# `verifier_depot.py` et `construire_distribution.py` ne tournent pas sur ce
# runner, délibérément. Depuis la passe F, tous deux REFUSENT de conclure
# sans les empreintes du dossier privé — un garde-fou qui approuve quand il
# ne peut pas travailler étant pire que pas de garde-fou (constats F-01 et
# F-03). Or `reference/` et `seed_exemple.sql` ne sont pas publiés : sur un
# clone, ces deux outils échouent volontairement.
#
# Les lancer ici obligerait donc soit à vivre avec une CI rouge en
# permanence, soit à leur ajouter un mode dégradé — c'est-à-dire à rouvrir
# exactement le défaut qu'on vient de refermer. Le contrôle de publication
# est un geste LOCAL, avant push, sur le poste qui détient les données :
#     python compta_lmnp/verifier_depot.py
#
# Ce que la CI vérifie en revanche, et qui a du sens partout : que la suite
# passe sur un clone public. Les tests qui exigent le dossier privé se
# sautent d'eux-mêmes (voir tests/conftest.py, `exiger_dossier_prive`).

name: Contrôles

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    # Le logiciel annonce « Python 3.12 ou plus récent » et ruff cible
    # py312 ; la CI n'éprouvait que 3.13. Les deux bornes qui comptent sont
    # le MINIMUM annoncé — celui qu'un utilisateur installera en suivant le
    # LISEZ-MOI — et la version la plus récente, sur laquelle une nouveauté
    # de Python peut casser sans prévenir. Tester entre les deux seulement,
    # c'est ne garantir aucune des deux (constat T-08).
    name: Tests et lint (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # un échec en 3.12 ne doit pas masquer 3.14
      matrix:
        python: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # L'arborescence portait le numéro de version — `compta_lmnp_v8.41.0/` —
      # et cette étape devait donc la CHERCHER, sinon la CI cassait au
      # prochain incrément. Le dossier s'appelle désormais `compta_lmnp/`,
      # sans version : le chemin est écrit une fois, en dur, et la recherche
      # disparaît. Un chemin stable est aussi ce qui permet aux liens
      # permanents d'un dépôt public de survivre à une release.
      - name: Vérifier que l'arborescence est là
        run: |
          test -f compta_lmnp/requirements-dev.txt || {
            echo "compta_lmnp/ introuvable ou incomplet." >&2; exit 1; }

      # pdftotext (poppler) : quatre fichiers de tests relisent le texte des
      # PDF produits, et `verifier_depot.py` s'en sert pour inspecter les PDF
      # avant publication. L'installation ne suffit pas — il faut VÉRIFIER
      # qu'elle a produit son effet. Sans le contrôle qui suit, une
      # installation sans effet ne se voyait pas ici : elle ressortait
      # quarante secondes plus tard, en cinq FileNotFoundError au milieu de
      # constats fiscaux, c'est-à-dire à l'endroit qui désigne le mauvais
      # coupable.
      - name: Dépendances système (poppler)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          command -v pdftotext || {
            echo "pdftotext absent APRÈS installation de poppler-utils." >&2
            exit 1; }
          pdftotext -v

      - name: Installer les dépendances épinglées
        run: |
          python -m pip install --upgrade pip
          pip install -r compta_lmnp/requirements-dev.txt

      - name: Tests
        working-directory: compta_lmnp
        run: pytest -q

      - name: Lint
        working-directory: compta_lmnp
        run: ruff check .

      # Filet : le dossier privé ne doit JAMAIS arriver jusqu'ici. S'il est
      # présent sur un runner, c'est qu'il a été committé.
      - name: Vérifier qu'aucune donnée privée n'a été publiée
        working-directory: compta_lmnp
        run: |
          fautifs=""
          [ -d reference ] && fautifs="$fautifs reference/"
          [ -f seed_exemple.sql ] && fautifs="$fautifs seed_exemple.sql"
          if [ -n "$fautifs" ]; then
            echo "FUITE — le dépôt publie :$fautifs" >&2
            exit 1
          fi
          echo "Ni reference/ ni seed_exemple.sql dans le dépôt publié."
