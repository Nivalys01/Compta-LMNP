# Contrôles automatiques — tests et lint à chaque poussée sur main.
#
# Ce qui N'EST PAS lancé ici, et pourquoi
# ---------------------------------------
# `verifier_depot.py` et `construire_distribution.py` ne tournent pas sur ce
# runner, délibérément. Depuis la passe F, tous deux REFUSENT de conclure
# sans les empreintes du dossier privé — un garde-fou qui approuve quand il
# ne peut pas travailler étant pire que pas de garde-fou (constats F-01 et
# F-03). Or `reference/` et `seed_exemple.sql` ne sont pas publiés : sur un
# clone, ces deux outils échouent volontairement.
#
# Les lancer ici obligerait donc soit à vivre avec une CI rouge en
# permanence, soit à leur ajouter un mode dégradé — c'est-à-dire à rouvrir
# exactement le défaut qu'on vient de refermer. Le contrôle de publication
# est un geste LOCAL, avant push, sur le poste qui détient les données :
#     python compta_lmnp_v*/compta_lmnp/verifier_depot.py
#
# Ce que la CI vérifie en revanche, et qui a du sens partout : que la suite
# passe sur un clone public. Les tests qui exigent le dossier privé se
# sautent d'eux-mêmes (voir tests/conftest.py, `exiger_dossier_prive`).

name: Contrôles

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    name: Tests et lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # L'arborescence porte le numéro de version : on la cherche au lieu de
      # l'écrire en dur, sinon la CI casse au prochain incrément.
      - name: Localiser l'arborescence du logiciel
        id: source
        run: |
          dossier=$(ls -d compta_lmnp_v*/compta_lmnp 2>/dev/null | sort -V | tail -1)
          if [ -z "$dossier" ]; then
            echo "Aucune arborescence compta_lmnp_v*/compta_lmnp trouvée." >&2
            exit 1
          fi
          echo "Arborescence : $dossier"
          echo "dossier=$dossier" >> "$GITHUB_OUTPUT"

      - name: Installer les dépendances épinglées
        run: |
          python -m pip install --upgrade pip
          pip install -r "${{ steps.source.outputs.dossier }}/requirements-dev.txt"

      - name: Tests
        working-directory: ${{ steps.source.outputs.dossier }}
        run: pytest -q

      - name: Lint
        working-directory: ${{ steps.source.outputs.dossier }}
        run: ruff check .

      # Filet : le dossier privé ne doit JAMAIS arriver jusqu'ici. S'il est
      # présent sur un runner, c'est qu'il a été committé.
      - name: Vérifier qu'aucune donnée privée n'a été publiée
        working-directory: ${{ steps.source.outputs.dossier }}
        run: |
          fautifs=""
          [ -d reference ] && fautifs="$fautifs reference/"
          [ -f seed_exemple.sql ] && fautifs="$fautifs seed_exemple.sql"
          if [ -n "$fautifs" ]; then
            echo "FUITE — le dépôt publie :$fautifs" >&2
            exit 1
          fi
          echo "Ni reference/ ni seed_exemple.sql dans le dépôt publié."
